<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Wind Turbine Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 0;
}

.status {
  padding: 8px 15px;
  border-radius: 20px;
  background: #022c22;
  color: #4ade80;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: rgba(30, 41, 59, 0.8);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.card h3 {
  margin: 0;
  color: #94a3b8;
}

.value {
  font-size: 32px;
  font-weight: bold;
  margin-top: 10px;
}

.chart {
  margin-top: 30px;
  background: rgba(30,41,59,0.8);
  border-radius: 20px;
  padding: 15px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>🌬️ Wind Turbine Dashboard</h1>
  <div class="status">● CONNECTÉ</div>
</div>

<div class="grid">
  <div class="card">
    <h3>Température</h3>
    <div id="temp" class="value">...</div>
  </div>

  <div class="card">
    <h3>Humidité</h3>
    <div id="hum" class="value">...</div>
  </div>

  <div class="card">
    <h3>Vent</h3>
    <div id="vent" class="value">...</div>
  </div>
</div>

<div class="chart">
  <canvas id="chart"></canvas>
</div>

</div>

<script>

// 🔧 A MODIFIER
const HA_URL = "https://clara-drink-marathon-pearl.trycloudflare.com";
const HA_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiI5MzMxNTVlMmNiMmQ0NDNmYTQ3MmMyZTRhNDFjNWY1ZiIsImlhdCI6MTc3NDUzMjg0MSwiZXhwIjoyMDg5ODkyODQxfQ.f5V4e7pYTAv8SCtr_Ctg-oE7BbEwjbCbicB4rdAnRWg";

// historique
let labels = [];
let tempData = [];

async function getData() {
  try {
    const res = await fetch(`${HA_URL}/api/states`, {
      headers: {
        "Authorization": `Bearer ${HA_TOKEN}`
      }
    });

    const data = await res.json();

    const temp = data.find(e => e.entity_id === "sensor.temperature");
    const hum = data.find(e => e.entity_id === "sensor.humidite");
    const vent = data.find(e => e.entity_id === "sensor.vent");

    const t = parseFloat(temp?.state);
    const h = parseFloat(hum?.state);
    const v = parseFloat(vent?.state);

    document.getElementById("temp").innerText = t + " °C";
    document.getElementById("hum").innerText = h + " %";
    document.getElementById("vent").innerText = v + " km/h";

    // graph
    labels.push(new Date().toLocaleTimeString());
    tempData.push(t);

    if(labels.length > 15){
      labels.shift();
      tempData.shift();
    }

    chart.update();

  } catch(err) {
    document.querySelector(".status").innerText = "● ERREUR";
    document.querySelector(".status").style.background = "#450a0a";
    document.querySelector(".status").style.color = "#f87171";
  }
}

const chart = new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: labels,
    datasets: [{
      label: "Température",
      data: tempData
    }]
  }
});

getData();
setInterval(getData, 5000);

</script>

</body>
</html>
